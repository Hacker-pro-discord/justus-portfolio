[build]
  command = "npm run build && npm test"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22.22.0"
  # This is a static Vinext export, not a Next.js server deployment.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static exports: both direct URL forms resolve without a catch-all SPA rewrite.
[[redirects]]
  from = "/3d-animation"
  to = "/3d-animation.html"
  status = 200

[[redirects]]
  from = "/3d-animation/"
  to = "/3d-animation.html"
  status = 200

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
